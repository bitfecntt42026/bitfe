          ${hasNutrientFilter ? `<button type="button" onclick="State.search='';State.vitaminQuery='';State.maxCalories='';renderAll()" class="w-fit rounded-full border border-[#dce2d4] bg-white px-4 py-2 text-xs font-medium text-[#234d38] hover:bg-[#eef2e8]">${tr("Xóa bộ lọc", "Clear all filters")}</button>` : ''}

        <p>
          <strong>${tr("Lưu ý về sản phẩm MẪU. ", "About products marked SAMPLE. ")}</strong>
          ${tr(
            "Các món thực đơn chính của Bitfe (Quinoa bowl, Cá hồi gạo lứt, Salad ức gà, Tôm áp chảo, Granola, Bột đạm...) là hàng thực có tồn kho để đặt mua ngay. Riêng các mục gắn nhãn SAMPLE INVENTORY / SẢN PHẨM MẪU chỉ minh họa danh mục (Chủ cửa hàng có thể xuất bản thành hàng thật trong mục Quản lý sản phẩm).",

          )}
        </p>
      </div>

      ${hasNutrientFilter ? `
        <section class="mb-7 rounded-2xl border border-[#dce2d4] bg-[#eef2e8] p-5">
          <h3 class="text-xl font-semibold text-[#234d38]">${tr("Gợi ý phù hợp", "Matching recommendations")}</h3>
          <p class="mb-4 mt-1 text-xs leading-6 text-[#626b5e]">${tr("Xếp theo độ khớp thông tin dinh dưỡng / thành phần đã cung cấp. Sản phẩm mẫu không đưa vào gợi ý dinh dưỡng.", "Ranked by matches to supplied nutrition / ingredient text. Sample inventory is excluded.")}</p>
          ${recommendations.length ? `
            <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
              ${recommendations.map(r => `
                <article class="rounded-2xl border border-[#cfdbc4] bg-white p-5">
                  <a href="#/products/${r.id}" onclick="navigate('detail', ${r.id})" class="text-sm font-semibold text-[#234d38] hover:underline">${tr(r.name_vi, r.name_en)}</a>
                  <p class="mt-2 text-xs leading-6 text-[#526348]">🔥 ${r.calories_kcal} kcal · ${r.protein_g}g ${tr("đạm", "protein")}<br>${tr(r.vitamins_vi, r.vitamins_en)}</p>
                </article>
              `).join("")}
            </div>
          ` : `<p class="rounded-xl border border-[#dce2d4] bg-white p-4 text-sm text-[#626b5e]">${tr("Chưa có gợi ý dinh dưỡng khớp bộ lọc hiện tại.", "No recommendations with matching supplied nutrient facts.")}</p>`}
        </section>
      ` : ''}

      ${filtered.length ? `
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
          ${filtered.map(p => {
            const sample = isSample(p);
            const hasOrig = p.original_price_vnd && p.original_price_vnd > p.price_vnd;
            return `
              <article class="min-w-0 overflow-hidden rounded-[20px] border border-[#e3e7db] bg-white transition-colors hover:border-[#b9c9aa] flex flex-col">
                <a href="#/products/${p.id}" onclick="navigate('detail', ${p.id})" class="group relative block overflow-hidden rounded-t-[20px]">
                  <img src="${p.image_url}" alt="${tr(p.name_vi, p.name_en)}" loading="lazy" class="aspect-[4/3] w-full object-cover transition-transform duration-500 group-hover:scale-105">
                  ${sample ? `<span class="absolute left-3 top-3 rounded-full bg-[#fafaf5]/95 px-2.5 py-1 text-[9px] font-semibold tracking-wider text-[#234d38]">${tr("SẢN PHẨM MẪU", "SAMPLE INVENTORY")}</span>` : ''}
                </a>
                <div class="p-5 flex-1 flex flex-col">
                  <p class="mb-2 text-[10px] font-semibold uppercase tracking-[0.13em] text-[#6d855d]">${categoryName(p.category)}</p>
                  <a href="#/products/${p.id}" onclick="navigate('detail', ${p.id})" class="hover:text-[#648358]">
                    <h3 class="text-base font-semibold leading-6 text-[#303d2c]">${tr(p.name_vi, p.name_en)}</h3>
                  </a>
                  <p class="mt-1.5 text-xs text-[#626b5e] line-clamp-2">${tr(p.description_vi, p.description_en)}</p>
                  <p class="mt-2 text-[11px] font-medium text-[#557448]">
                    ${sample || p.calories_kcal === null
                ? tr("Chưa có dữ liệu dinh dưỡng", "Nutrition not supplied")
                : `${p.calories_kcal} kcal · ${p.protein_g} g ${tr("đạm / khẩu phần", "protein / serving")}`}
                  </p>
                  <div class="mt-auto pt-5 flex items-center justify-between gap-2">
                    <div class="text-base font-semibold text-[#234d38]">
                      ${hasOrig ? `<s class="block text-xs font-normal text-[#626b5e]">${money(p.original_price_vnd)}</s>` : ''}

                      + ${tr("Thêm", "Add")}
                    </button>
                  </div>
                  ${(p.stock_quantity <= 0 || sample) ? `
                    <p class="mt-2 text-xs text-red-700">${sample ? tr("Mẫu minh họa · không thể đặt mua", "Sample only · no actual availability") : tr("Hết hàng", "Out of stock")}</p>
                  ` : ''}
                </div>
              </article>
            `;
          }).join("")}
        </div>
      ` : `
        <div class="rounded-2xl border border-[#dce2d4] bg-white px-6 py-16 text-center">
          <h3 class="text-lg font-medium text-[#234d38]">${tr("Không tìm thấy sản phẩm", "No products found")}</h3>
          <button onclick="State.search='';State.vitaminQuery='';State.maxCalories='';State.category='all';renderAll()" class="mt-4 rounded-full bg-[#234d38] px-5 py-2.5 text-sm text-white">${tr("Xóa bộ lọc / thử lại", "Clear filters / retry")}</button>
        </div>
      `}
    </section>
  `;
    }

    // ============================================================================
    // 7. DETAIL
    // ============================================================================
    function renderDetail() {
      const p = State.products.find(x => x.id === State.selectedProductId);
      if (!p) return `<div class="py-20 text-center"><h1 class="text-2xl text-[#234d38]">${tr("Không tìm thấy sản phẩm", "Product not found")}</h1></div>`;
      const sample = isSample(p);
      const hasOrig = p.original_price_vnd && p.original_price_vnd > p.price_vnd;

      return `
    <div class="mx-auto w-full max-w-[1440px] px-5 py-10 sm:px-8 lg:px-16">
      <a href="#/" onclick="navigate('shop')" class="mb-7 inline-flex items-center gap-2 text-sm text-[#557448] hover:underline">
        ← ${tr("Quay lại cửa hàng", "Back to the shop")}
      </a>
      <div class="grid grid-cols-1 gap-8 lg:grid-cols-2 lg:gap-14">
        <div>
          <img src="${p.image_url}" alt="${tr(p.name_vi, p.name_en)}" class="aspect-square max-h-[540px] w-full rounded-3xl object-cover border border-[#dce2d4]">
          <p class="mt-3 text-center text-xs text-[#626b5e]">${tr("Hình minh họa; sản phẩm thực tế có thể khác đôi chút.", "Illustrative image; the actual product may differ.")}</p>
        </div>
        <div>
          <p class="text-xs font-semibold uppercase tracking-widest text-[#648358]">${categoryName(p.category)}</p>
          <h1 class="mt-3 text-3xl font-medium tracking-tight text-[#234d38] sm:text-4xl">${tr(p.name_vi, p.name_en)}</h1>
          <div class="mt-5 text-2xl font-semibold text-[#234d38]">
            ${hasOrig ? `<s class="block text-sm font-normal text-[#626b5e]">${money(p.original_price_vnd)}</s>` : ''}
            ${money(p.price_vnd)}
          </div>
          <p class="mt-5 text-sm leading-7 text-[#626b5e]">${tr(p.description_vi, p.description_en)}</p>

          <div class="mt-7 flex items-center gap-5">
            <span class="text-sm text-[#626b5e]">${tr("Số lượng", "Quantity")}</span>
            <div class="flex items-center rounded-full border border-[#dce2d4] bg-white">
              <button onclick="State.detailQuantity=Math.max(1,State.detailQuantity-1);renderAll()" class="rounded-full px-4 py-2 text-[#234d38] hover:bg-[#edf2e7]">−</button>
              <span class="w-8 text-center text-sm text-[#234d38]">${State.detailQuantity}</span>
              <button onclick="State.detailQuantity=Math.min(${p.stock_quantity || 1},State.detailQuantity+1);renderAll()" class="rounded-full px-4 py-2 text-[#234d38] hover:bg-[#edf2e7]">+</button>
            </div>
          </div>

          <button onclick="addToCart(${p.id}, State.detailQuantity)" ${(p.stock_quantity <= 0 || sample) ? 'disabled' : ''} class="mt-5 flex w-full items-center justify-center gap-3 rounded-full bg-[#234d38] px-6 py-4 text-sm font-semibold text-white hover:bg-[#173a29] disabled:opacity-40">
            🛍️ ${tr("Thêm vào giỏ hàng", "Add to bag")}
          </button>

          <p class="mt-3 text-xs text-[#626b5e]">
            ${sample
          ? tr("SẢN PHẨM MẪU — Giá/số lượng chỉ minh họa, chưa xác nhận hàng thực hay giao hàng.", "SAMPLE INVENTORY — Illustrative price/quantity only.")
          : (p.stock_quantity > 0 ? tr(`Còn ${p.stock_quantity} sản phẩm`, `${p.stock_quantity} available`) : tr("Hết hàng", "Out of stock"))}
          </p>

          <div class="mt-6 rounded-xl border border-[#dce2d4] bg-[#fafaf5] p-4">
            <h2 class="text-base font-semibold text-[#234d38]">${tr("Thành phần", "Ingredients")}</h2>
            <p class="mt-2 text-sm leading-6 text-[#626b5e]">${tr(p.ingredients_vi, p.ingredients_en) || tr("Chưa được người bán cung cấp.", "Not supplied by the seller.")}</p>
          </div>

          <div class="mt-4 rounded-xl border border-[#dce2d4] bg-[#fafaf5] p-4">
            <h2 class="text-base font-semibold text-[#234d38]">${tr("Vitamin — thông tin do người bán cung cấp", "Vitamins — seller-supplied statements")}</h2>
            <p class="mt-2 text-sm leading-6 text-[#626b5e]">${tr(p.vitamins_vi, p.vitamins_en) || tr("Chưa được người bán cung cấp.", "Not supplied by the seller.")}</p>
          </div>

          <h2 class="mt-8 text-lg font-semibold text-[#234d38]">${tr("Thông tin dinh dưỡng", "A closer look at nutrition")}</h2>
          <p class="mt-1 text-xs text-[#626b5e]">
            ${p.serving_size_g ? tr(`Mỗi khẩu phần ${p.serving_size_g} g. Dấu — nghĩa là chưa có thông tin.`, `Per ${p.serving_size_g} g serving. — means not supplied.`) : tr("Chưa cung cấp khối lượng khẩu phần.", "Serving weight has not been supplied.")}
          </p>
          <dl class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3">
            <div class="rounded-xl border border-[#dce2d4] bg-[#f3f5ed] p-4"><dt class="text-xs text-[#626b5e]">${tr("Năng lượng", "Energy")}</dt><dd class="mt-2 text-base font-semibold text-[#234d38]">${fmtNum(p.calories_kcal)} kcal</dd></div>
            <div class="rounded-xl border border-[#dce2d4] bg-[#f3f5ed] p-4"><dt class="text-xs text-[#626b5e]">${tr("Chất đạm", "Protein")}</dt><dd class="mt-2 text-base font-semibold text-[#234d38]">${fmtNum(p.protein_g)} g</dd></div>
            <div class="rounded-xl border border-[#dce2d4] bg-[#f3f5ed] p-4"><dt class="text-xs text-[#626b5e]">${tr("Tinh bột", "Carbohydrate")}</dt><dd class="mt-2 text-base font-semibold text-[#234d38]">${fmtNum(p.carbohydrate_g)} g</dd></div>
            <div class="rounded-xl border border-[#dce2d4] bg-[#f3f5ed] p-4"><dt class="text-xs text-[#626b5e]">${tr("Chất béo", "Fat")}</dt><dd class="mt-2 text-base font-semibold text-[#234d38]">${fmtNum(p.fat_g)} g</dd></div>
            <div class="rounded-xl border border-[#dce2d4] bg-[#f3f5ed] p-4"><dt class="text-xs text-[#626b5e]">${tr("Chất xơ", "Fiber")}</dt><dd class="mt-2 text-base font-semibold text-[#234d38]">${fmtNum(p.fiber_g)} g</dd></div>
            <div class="rounded-xl border border-[#dce2d4] bg-[#f3f5ed] p-4"><dt class="text-xs text-[#626b5e]">${tr("Đường", "Sugars")}</dt><dd class="mt-2 text-base font-semibold text-[#234d38]">${fmtNum(p.sugar_g)} g</dd></div>
            <div class="rounded-xl border border-[#dce2d4] bg-[#f3f5ed] p-4"><dt class="text-xs text-[#626b5e]">${tr("Natri", "Sodium")}</dt><dd class="mt-2 text-base font-semibold text-[#234d38]">${fmtNum(p.sodium_mg)} mg</dd></div>
          </dl>
          <p class="mt-5 rounded-xl border border-[#dce2d4] bg-[#f0f3e8] p-4 text-xs leading-6 text-[#526348]">${tr(p.nutrition_notes_vi, p.nutrition_notes_en)}</p>
        </div>
      </div>
    </div>
  `;
    }

    // ============================================================================
    // 8. CART & CHECKOUT
    // ============================================================================
    function addToCart(id, qty) {
      const p = State.products.find(x => x.id === id);
      if (!p || isSample(p) || p.stock_quantity <= 0) {
        showNotice("Sản phẩm mẫu không thể đặt mua.", "Sample items cannot be purchased.", true);
        return;
      }
      State.cart[id] = Math.min(p.stock_quantity, (State.cart[id] || 0) + qty);
      if (State.cartSelection[id] === undefined) State.cartSelection[id] = true;
      saveStorage();
      renderAll();
      showNotice(`Đã thêm "${p.name_vi}" vào giỏ hàng.`, `Added "${p.name_en}" to your bag.`);
    }

    function getCartItems() {
      return Object.entries(State.cart)
        .map(([id, qty]) => {
          const p = State.products.find(x => x.id === Number(id));
          return p && !isSample(p) && qty > 0 ? { ...p, quantity: qty, selected: State.cartSelection[id] !== false } : null;
        })
        .filter(Boolean);
    }

    function renderCart() {
      const items = getCartItems();
      const selected = items.filter(i => i.selected);
      const subtotal = selected.reduce((s, i) => s + i.price_vnd * i.quantity, 0);
      const fee = selected.length === 0 ? 0 : (subtotal >= 300000 ? 0 : 30000);
      const allSelected = items.length > 0 && items.every(i => i.selected);

      return `
    <div class="mx-auto w-full max-w-[1440px] px-5 py-10 sm:px-8 lg:px-16">
      <p class="text-[10px] font-semibold tracking-widest text-[#648358]">${tr("CHỌN LÀNH, ĂN NGON", "YOUR EVERYDAY GOODNESS")}</p>
      <h1 class="mb-3 mt-3 text-4xl font-medium tracking-tight text-[#234d38]">${tr("Giỏ hàng của bạn", "Your shopping bag")}</h1>
      <p class="mb-7 text-sm text-[#626b5e]">${tr("Kiểm tra sản phẩm, số lượng và tổng tiền trước khi thanh toán.", "Review products, quantities and totals before checkout.")}</p>

      ${items.length ? `
        <div class="grid w-full grid-cols-1 gap-8 lg:grid-cols-[minmax(0,1fr)_360px]">
          <div class="min-w-0 rounded-2xl border border-[#dce2d4] bg-white px-5 pb-6 sm:px-7">
            <button onclick="toggleAllCart(${!allSelected})" class="mt-5 flex min-h-11 items-center gap-3 rounded-full border border-[#dce2d4] bg-[#eef2e8] px-4 py-2 text-sm text-[#234d38] hover:bg-[#e5edde]">
              <span>${allSelected ? '☑️' : '⬜'}</span> ${tr("Chọn / bỏ chọn tất cả", "Select / deselect all")}
            </button>
            <p class="mt-3 text-xs text-[#626b5e]">${tr("Mục chưa chọn vẫn ở trong giỏ hàng; chỉ mục đã chọn được thanh toán.", "Unselected items stay in your bag; only selected items go to checkout.")}</p>
            ${items.map(item => `
              <article class="flex flex-wrap items-start gap-4 border-b border-[#e3e7da] py-6 last:border-b-0 sm:flex-nowrap">
                <button onclick="State.cartSelection[${item.id}]=!${item.selected};saveStorage();renderAll()" class="rounded-lg bg-white p-2 text-lg text-[#234d38]">${item.selected ? '☑️' : '⬜'}</button>
                <img src="${item.image_url}" alt="${tr(item.name_vi, item.name_en)}" class="size-20 rounded-xl object-cover sm:size-24">
                <div class="min-w-0 flex-1">
                  <a href="#/products/${item.id}" onclick="navigate('detail', ${item.id})" class="text-base font-semibold text-[#234d38] hover:underline">${tr(item.name_vi, item.name_en)}</a>
                  <p class="mt-1 text-xs text-[#626b5e]">${money(item.price_vnd)} · 🔥 ${item.calories_kcal || 0} kcal</p>
                  <div class="mt-3 flex items-center gap-3">
                    <div class="flex items-center rounded-full border border-[#dce2d4] bg-white">
                      <button onclick="updateCartQty(${item.id}, -1)" class="px-3 py-1">−</button>
                      <span class="min-w-6 text-center text-xs">${item.quantity}</span>
                      <button onclick="updateCartQty(${item.id}, 1)" class="px-3 py-1">+</button>
                    </div>
                    <button onclick="delete State.cart[${item.id}];saveStorage();renderAll()" class="text-xs text-[#626b5e] hover:text-red-700">🗑️ ${tr("Xóa", "Remove")}</button>
                  </div>
                </div>
                <div class="text-sm font-semibold text-[#234d38]">${money(item.price_vnd * item.quantity)}</div>
              </article>
            `).join("")}
          </div>

          <aside class="h-fit w-full rounded-2xl border border-[#dce2d4] bg-[#f0f3e8] p-6">
            <h2 class="text-xl font-semibold text-[#234d38]">${tr("Tóm tắt đơn hàng", "Order summary")}</h2>
            <div class="mt-6 space-y-3 text-sm text-[#626b5e]">
              <div class="flex justify-between"><span>${tr("Tạm tính", "Subtotal")}</span><span>${money(subtotal)}</span></div>
              <div class="flex justify-between"><span>${tr("Giao hàng", "Delivery")}</span><span>${money(fee)}</span></div>
            </div>
            <div class="mt-5 flex justify-between border-t border-[#dce2d4] pt-5 text-lg font-semibold text-[#234d38]">
              <span>${tr("Tổng cộng", "Total")}</span><span>${money(subtotal + fee)}</span>
            </div>
            <p class="mt-3 text-xs leading-5 text-[#626b5e]">🚚 ${tr("Phí giao hàng 30.000 ₫; miễn phí từ 300.000 ₫.", "30,000 ₫ delivery; free over 300,000 ₫.")}</p>
            <button onclick="navigate('checkout')" ${selected.length === 0 ? 'disabled' : ''} class="mt-6 w-full rounded-full bg-[#234d38] px-6 py-3.5 text-sm font-semibold text-white hover:bg-[#173a29] disabled:opacity-40">
              ${tr("Tiến hành thanh toán", "Continue to checkout")}
            </button>
          </aside>
        </div>
      ` : `
        <div class="rounded-3xl border border-[#dce2d4] bg-white px-5 py-20 text-center">
          <h2 class="text-2xl font-medium text-[#234d38]">${tr("Giỏ hàng đang chờ một chút lành", "Your bag is waiting for some goodness")}</h2>
          <button onclick="navigate('shop')" class="mt-6 rounded-full bg-[#234d38] px-6 py-3.5 text-sm font-semibold text-white">${tr("Khám phá cửa hàng", "Explore the shop")} ↗</button>
        </div>
      `}
    </div>
  `;
    }

    function toggleAllCart(val) {
      Object.keys(State.cart).forEach(k => State.cartSelection[k] = val);
      saveStorage();
      renderAll();
    }

    function updateCartQty(id, delta) {
      const next = (State.cart[id] || 0) + delta;
      if (next <= 0) delete State.cart[id];
      else State.cart[id] = next;
      saveStorage();
      renderAll();
    }

    function renderCheckout() {
      const selected = getCartItems().filter(i => i.selected);
      if (!selected.length) return renderCart();
      const subtotal = selected.reduce((s, i) => s + i.price_vnd * i.quantity, 0);
      const fee = subtotal >= 300000 ? 0 : 30000;
      const prof = State.profile;

      return `
    <div class="mx-auto w-full max-w-[1440px] px-5 py-10 sm:px-8 lg:px-16">
      <a href="#/cart" onclick="navigate('cart')" class="mb-6 inline-flex items-center gap-2 text-sm text-[#557448] hover:underline">← ${tr("Quay lại giỏ hàng", "Back to your bag")}</a>
      <h1 class="mb-3 text-3xl font-medium tracking-tight text-[#234d38]">${tr("Một bước nữa tới bữa lành", "One step closer to goodness")}</h1>
      <div class="grid w-full grid-cols-1 gap-8 lg:grid-cols-[minmax(0,1fr)_380px] mt-6">
        <form onsubmit="submitCheckout(event)" class="space-y-6">
          <section class="rounded-2xl border border-[#dce2d4] bg-white p-6">
            <h2 class="mb-4 text-lg font-semibold text-[#234d38]">01. ${tr("Thông tin liên hệ", "Contact details")}</h2>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <div><label class="mb-1 block text-xs font-medium">${tr("Họ và tên *", "Full name *")}</label><input id="ck_name" required value="${prof.display_name}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
              <div><label class="mb-1 block text-xs font-medium">Email *</label><input id="ck_email" type="email" required value="${prof.email}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
              <div><label class="mb-1 block text-xs font-medium">${tr("Số điện thoại *", "Phone number *")}</label><input id="ck_phone" required value="${prof.phone}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
            </div>
          </section>

          <section class="rounded-2xl border border-[#dce2d4] bg-white p-6">
            <h2 class="mb-4 text-lg font-semibold text-[#234d38]">02. ${tr("Giao hàng tại Việt Nam", "Delivery in Vietnam")}</h2>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <div class="sm:col-span-2"><label class="mb-1 block text-xs font-medium">${tr("Số nhà, tên đường *", "Street address *")}</label><input id="ck_addr" required value="${prof.shipping_address_line1}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
              <div><label class="mb-1 block text-xs font-medium">${tr("Phường / xã *", "Ward / commune *")}</label><input id="ck_ward" required value="${prof.shipping_ward}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
              <div><label class="mb-1 block text-xs font-medium">${tr("Quận / huyện *", "District *")}</label><input id="ck_dist" required value="${prof.shipping_district}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
              <div><label class="mb-1 block text-xs font-medium">${tr("Tỉnh / thành phố *", "Province / city *")}</label><input id="ck_city" required value="${prof.shipping_city}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
              <div><label class="mb-1 block text-xs font-medium">${tr("Mã bưu chính (5 số)", "Postal code (5 digits)")}</label><input id="ck_postal" value="${prof.shipping_postal_code}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
              <div class="sm:col-span-2"><label class="mb-1 block text-xs font-medium">${tr("Ghi chú giao hàng", "Delivery notes")}</label><input id="ck_notes" placeholder="${tr("Hướng dẫn tìm địa chỉ, giờ nhận...", "Delivery instructions...")}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
            </div>
          </section>

          <section class="rounded-2xl border border-[#dce2d4] bg-white p-6">
            <h2 class="mb-4 text-lg font-semibold text-[#234d38]">03. ${tr("Xem lại & thanh toán", "Review & payment")}</h2>
            <div class="flex flex-wrap gap-3 mb-4">
              <button type="button" onclick="State.paymentMethod='cod';renderAll()" class="rounded-xl border px-5 py-3 text-sm ${State.paymentMethod === 'cod' ? 'border-[#234d38] bg-[#234d38] text-white' : 'border-[#dce2d4] bg-white text-[#234d38]'}">${tr("Trả khi nhận hàng (COD)", "Pay on delivery (COD)")}</button>
              <button type="button" onclick="State.paymentMethod='online';renderAll()" class="rounded-xl border px-5 py-3 text-sm ${State.paymentMethod === 'online' ? 'border-[#234d38] bg-[#234d38] text-white' : 'border-[#dce2d4] bg-white text-[#234d38]'}">${tr("Thanh toán trực tuyến (Stripe)", "Online payment (Stripe)")}</button>
            </div>
            <p class="text-xs leading-6 text-[#626b5e]">
              ${State.paymentMethod === 'cod'
          ? tr("Đặt đơn thật cho hàng đang có. Trừ tồn kho ngay khi đặt; chờ người bán xác nhận và thanh toán khi nhận hàng.", "Place a real order for available inventory. Reserves stock immediately; pay on delivery.")
          : tr("Tạo phiên thanh toán trực tuyến qua cổng Stripe và xác minh trạng thái tự động.", "Create an online payment session via Stripe Checkout.")}
            </p>
            <button type="submit" class="mt-6 w-full rounded-full bg-[#234d38] px-5 py-4 text-sm font-semibold text-white hover:bg-[#173a29]">
              ${State.paymentMethod === 'cod' ? tr("Đặt hàng · Trả khi nhận hàng", "Place order · Pay on delivery") : tr("Thanh toán trực tuyến ngay", "Pay online now")}
            </button>
          </section>
        </form>

        <aside class="h-fit w-full rounded-2xl border border-[#dce2d4] bg-[#f0f3e8] p-6">
          <h2 class="text-xl font-semibold text-[#234d38]">${tr("Tóm tắt đơn hàng", "Order summary")}</h2>
          <div class="mt-4 border-b border-[#dce2d4] pb-4 space-y-3">
            ${selected.map(i => `
              <div class="flex items-center gap-3 text-xs">
                <img src="${i.image_url}" class="size-12 rounded-lg object-cover">
                <div class="flex-1"><p class="font-medium text-[#234d38]">${tr(i.name_vi, i.name_en)}</p><p class="text-[#626b5e]">× ${i.quantity}</p></div>
                <span>${money(i.price_vnd * i.quantity)}</span>
              </div>
            `).join("")}
          </div>
          <div class="mt-4 space-y-2 text-sm text-[#626b5e]">
            <div class="flex justify-between"><span>${tr("Tạm tính", "Subtotal")}</span><span>${money(subtotal)}</span></div>
            <div class="flex justify-between"><span>${tr("Phí giao hàng", "Delivery")}</span><span>${money(fee)}</span></div>
          </div>
          <div class="mt-4 flex justify-between border-t border-[#dce2d4] pt-4 text-lg font-semibold text-[#234d38]">
            <span>${tr("Tổng cộng", "Total")}</span><span>${money(subtotal + fee)}</span>
          </div>
        </aside>
      </div>
    </div>
  `;
    }

    function submitCheckout(e) {
      e.preventDefault();
      const selected = getCartItems().filter(i => i.selected);
      if (!selected.length) return;
      const subtotal = selected.reduce((s, i) => s + i.price_vnd * i.quantity, 0);
      const fee = subtotal >= 300000 ? 0 : 30000;
      const nowStr = new Date().toLocaleString("vi-VN");
      const newId = 1000 + State.orders.length + 1;
      const isOnline = State.paymentMethod === "online";

      selected.forEach(item => {
        const p = State.products.find(x => x.id === item.id);
        if (p) p.stock_quantity = Math.max(0, p.stock_quantity - item.quantity);
        delete State.cart[item.id];
        delete State.cartSelection[item.id];
      });

      const order = {
        id: newId,
        number: `NB-${newId}`,
        date: nowStr,
        buyer_sub: NB_AUTH_USER?.id || "buyer-1",
        method: State.paymentMethod,
        status: "pending",
        payment: isOnline ? "pending" : "unpaid",
        total: subtotal + fee,
        fee,
        commission_bps_snapshot: State.commissionBps,
        address: `${document.getElementById("ck_name").value} · ${document.getElementById("ck_phone").value} — ${document.getElementById("ck_addr").value}, ${document.getElementById("ck_ward").value}, ${document.getElementById("ck_dist").value}, ${document.getElementById("ck_city").value}`,
        contact: document.getElementById("ck_email").value,
        notes: document.getElementById("ck_notes").value,
        items: selected.map(i => ({ id: i.id, name_vi: i.name_vi, name_en: i.name_en, price: i.price_vnd, quantity: i.quantity })),
        events: [
          { action: "created_stock_reserved", status: "pending", payment: isOnline ? "pending" : "unpaid", date: nowStr },
          ...(isOnline ? [{ action: "stripe_payment_verified", status: "pending", payment: "paid", date: nowStr }] : [])
        ],
        review: null,
        messages: []
      };

      State.orders.unshift(order);
      saveStorage();
      navigate("orders");
      showNotice(`Đặt đơn hàng ${order.number} thành công! Tồn kho đã được giữ.`, `Order ${order.number} placed and stock reserved!`);
    }

    // ============================================================================
    // 9. ORDERS
    // ============================================================================
    function statusLabel(st) {
      const m = {
        pending: tr("Chờ xác nhận", "Awaiting confirmation"),
        confirmed: tr("Đã xác nhận", "Confirmed"),
        processing: tr("Đang chuẩn bị", "Preparing"),
        shipped: tr("Đang giao", "In transit"),
        delivered: tr("Đã giao", "Delivered"),
        cancelled: tr("Đã hủy", "Cancelled")
      };
      return m[st] || st;
    }

    function paymentLabel(pm) {
      const m = {
        unpaid: tr("Chưa thanh toán", "Unpaid"),
        pending: tr("Chờ xác minh thanh toán", "Payment not verified"),
        paid: tr("Đã thanh toán", "Paid"),
        cancelled: tr("Thanh toán đã hủy", "Payment cancelled")
      };
      return m[pm] || pm;
    }

    function actionLabel(act) {
      const m = {
        created_stock_reserved: tr("Đã đặt đơn · giữ tồn kho", "Order placed · stock reserved"),
        confirm: tr("Người bán đã xác nhận", "Seller confirmed"),
        ship: tr("Bắt đầu giao hàng", "Dispatched"),
        deliver: tr("Xác nhận đã giao (không tự động tính thu tiền)", "Delivery recorded (not payment collection)"),
        collect_cash: tr("Người bán xác nhận đã thu tiền mặt", "Seller explicitly confirmed cash collection"),
        cancel: tr("Người bán đã hủy đơn · hoàn tồn kho", "Seller cancelled · stock released"),
        stripe_payment_verified: tr("Stripe xác minh thanh toán", "Stripe verified payment")
      };
      return m[act] || act;
    }

    function renderOrderCard(o, sellerView = false) {
      const commAmt = o.commission_bps_snapshot !== null ? Math.round((o.total * o.commission_bps_snapshot) / 10000) : 0;
      return `
    <article class="min-w-0 rounded-3xl border border-[#dce2d4] bg-white p-6 sm:p-8">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 class="text-xl font-semibold text-[#234d38]">${o.number}</h2>
        <span class="rounded-full border border-[#dce2d4] bg-[#edf2e7] px-4 py-1.5 text-xs font-semibold text-[#234d38]">${statusLabel(o.status)}</span>
      </div>
      <time class="mt-1 block text-xs text-[#626b5e]">${o.date}</time>
      <p class="mt-3 text-sm font-semibold text-[#30382e]">
        ${o.method === "cod" ? tr("Thanh toán khi nhận hàng (COD)", "Pay on delivery") : tr("Thanh toán trực tuyến", "Online payment")} · <span class="${o.payment === 'paid' ? 'text-[#234d38]' : 'text-amber-700'}">${paymentLabel(o.payment)}</span>
      </p>

      <ul class="mt-4 border-y border-[#dce2d4] py-3 space-y-2">
        ${o.items.map(i => `<li class="flex justify-between text-sm"><span>${tr(i.name_vi, i.name_en)} × ${i.quantity}</span><span>${money(i.price * i.quantity)}</span></li>`).join("")}
      </ul>

      <div class="mt-4 flex justify-between font-semibold text-[#234d38]">
        <span>${tr("Tổng cộng (gồm giao hàng)", "Total (including delivery)")}</span>
        <span>${money(o.total)}</span>
      </div>
      <p class="mt-1 text-xs text-[#626b5e]">${tr("Phí giao hàng: ", "Delivery fee: ")}${money(o.fee)}</p>
      <p class="mt-3 text-sm text-[#626b5e]">📍 ${o.address}</p>
      ${o.notes ? `<p class="mt-1 text-xs text-[#626b5e]">📝 ${o.notes}</p>` : ''}
      ${sellerView ? `<p class="mt-2 text-xs text-[#557448]">${tr("Hoa hồng chốt lúc đặt: ", "Commission at purchase: ")}${(o.commission_bps_snapshot / 100).toFixed(2)}% (${money(commAmt)})</p>` : ''}

      <details class="mt-4">
        <summary class="cursor-pointer py-2 text-sm font-medium text-[#234d38]">${tr("Lịch sử sự kiện đơn hàng", "Order timeline")} (${o.events.length})</summary>
        <ol class="mt-2 space-y-2 border-l-2 border-[#dce2d4] pl-4">
          ${o.events.map(ev => `
            <li class="text-xs">
              <p class="font-semibold text-[#234d38]">${actionLabel(ev.action)}</p>
              <p class="text-[#626b5e]">${statusLabel(ev.status)} · ${paymentLabel(ev.payment)} · ${ev.date}</p>
            </li>
          `).join("")}
        </ol>
      </details>

      ${sellerView ? `
        <div class="mt-5 flex flex-wrap gap-2 border-t border-[#dce2d4] pt-4">
          ${o.status === "pending" ? `<button onclick="mutateOrder(${o.id}, 'confirm')" class="rounded-full border border-[#b9c9aa] bg-white px-4 py-2 text-xs font-semibold text-[#234d38] hover:bg-[#edf2e7]">${tr("Xác nhận đơn", "Confirm order")}</button>` : ''}
          ${o.status === "confirmed" ? `<button onclick="mutateOrder(${o.id}, 'ship')" class="rounded-full border border-[#b9c9aa] bg-white px-4 py-2 text-xs font-semibold text-[#234d38] hover:bg-[#edf2e7]">${tr("Bắt đầu giao", "Mark in transit")}</button>` : ''}
          ${o.status === "shipped" ? `<button onclick="mutateOrder(${o.id}, 'deliver')" class="rounded-full border border-[#b9c9aa] bg-white px-4 py-2 text-xs font-semibold text-[#234d38] hover:bg-[#edf2e7]">${tr("Xác nhận đã giao (chưa thu tiền)", "Mark delivered")}</button>` : ''}
          ${o.status === "delivered" && o.payment === "unpaid" && o.method === "cod" ? `<button onclick="mutateOrder(${o.id}, 'collect_cash')" class="rounded-full bg-[#234d38] px-4 py-2 text-xs font-semibold text-white hover:bg-[#173a29]">${tr("Tôi đã nhận đủ tiền mặt (COD)", "Confirm cash collection")}</button>` : ''}
          ${(o.status === "pending" || o.status === "confirmed") && o.payment === "unpaid" ? `<button onclick="mutateOrder(${o.id}, 'cancel')" class="rounded-full border border-red-300 bg-red-50 px-4 py-2 text-xs font-semibold text-red-800 hover:bg-red-100">${tr("Hủy đơn & hoàn kho", "Cancel & release stock")}</button>` : ''}
        </div>
      ` : ''}

      <div class="mt-5 border-t border-[#dce2d4] pt-4">
        <h3 class="text-sm font-semibold text-[#234d38]">⭐ ${tr("Đánh giá dịch vụ & đơn hàng (1–5 sao)", "Order-linked store review (1–5 stars)")}</h3>
        ${o.review ? `
          <div class="mt-2 rounded-xl bg-[#f0f3e8] p-3.5 text-xs">
            <div class="font-bold text-amber-600">${"★".repeat(o.review.rating)}${"☆".repeat(5 - o.review.rating)} (${o.review.rating}/5)</div>
            <p class="mt-1 text-sm text-[#30382e]">${o.review.text}</p>
            <span class="mt-1 block text-[11px] text-[#626b5e]">${tr("Cập nhật lúc: ", "Updated: ")}${o.review.updated_at}</span>
          </div>
        ` : (!sellerView ? `
          <form onsubmit="submitOrderReview(event, ${o.id})" class="mt-2 flex flex-wrap gap-2">
            <select id="rev_star_${o.id}" class="rounded-xl border border-[#dce2d4] bg-white px-3 py-2 text-xs font-semibold text-[#234d38]">
              <option value="5">★★★★★ (5 sao)</option>
              <option value="4">★★★★☆ (4 sao)</option>
              <option value="3">★★★☆☆ (3 sao)</option>
              <option value="2">★★☆☆☆ (2 sao)</option>
              <option value="1">★☆☆☆☆ (1 sao)</option>
            </select>
            <input id="rev_text_${o.id}" required maxlength="2000" placeholder="${tr("Viết nhận xét về chất lượng món ăn và giao hàng...", "Share your experience with this order...")}" class="flex-1 rounded-xl border border-[#dce2d4] bg-white px-3 py-2 text-xs">
            <button type="submit" class="rounded-full bg-[#234d38] px-4 py-2 text-xs font-semibold text-white">${tr("Gửi đánh giá", "Save review")}</button>
          </form>
        ` : `<p class="mt-1 text-xs text-[#626b5e]">${tr("Người mua chưa gửi đánh giá cho đơn này.", "Buyer has not submitted a review yet.")}</p>`)}
      </div>

      <div class="mt-4 border-t border-[#dce2d4] pt-4">
        <h3 class="text-sm font-semibold text-[#234d38]">💬 ${tr("Trò chuyện Người mua – Chủ cửa hàng", "Buyer–Seller conversation")} (${(o.messages || []).length})</h3>
        <div class="mt-2 max-h-40 space-y-2 overflow-y-auto rounded-xl bg-[#fafaf5] p-3 border border-[#e3e7db]">
          ${(o.messages || []).length ? o.messages.map(m => `
            <div class="text-xs ${m.sender_role === 'seller' ? 'text-[#234d38]' : 'text-[#30382e]'}">
              <span class="font-semibold">${m.sender_role === 'seller' ? tr("Chủ cửa hàng", "Seller") : tr("Người mua", "Buyer")}:</span> ${m.body}
              <span class="ml-2 text-[10px] text-[#626b5e]">${m.created_at}</span>
            </div>
          `).join("") : `<p class="text-xs text-[#626b5e]">${tr("Chưa có tin nhắn nào cho đơn này.", "No messages yet for this order.")}</p>`}
        </div>
        <form onsubmit="sendOrderMessage(event, ${o.id}, '${sellerView ? 'seller' : 'buyer'}')" class="mt-2 flex gap-2">
          <input id="msg_${sellerView ? 's' : 'b'}_${o.id}" required maxlength="2000" placeholder="${tr("Nhập tin nhắn trao đổi về đơn hàng...", "Write a message about this order...")}" class="flex-1 rounded-xl border border-[#dce2d4] bg-white px-3 py-2 text-xs">
          <button type="submit" class="rounded-full border border-[#234d38] bg-white px-4 py-2 text-xs font-semibold text-[#234d38] hover:bg-[#edf2e7]">${tr("Gửi", "Send")}</button>
        </form>
      </div>
    </article>
  `;
    }

    function mutateOrder(orderId, action) {
      const o = State.orders.find(x => x.id === orderId);
      if (!o) return;
      const nowStr = new Date().toLocaleString("vi-VN");
      if (action === "confirm") o.status = "confirmed";
      else if (action === "ship") o.status = "shipped";
      else if (action === "deliver") o.status = "delivered";
      else if (action === "collect_cash") o.payment = "paid";
      else if (action === "cancel") {
        o.status = "cancelled";
        o.items.forEach(item => {
          const p = State.products.find(x => x.id === item.id);
          if (p) p.stock_quantity += item.quantity;
        });
      }
      o.events.push({ action, status: o.status, payment: o.payment, date: nowStr });
      saveStorage();
      renderAll();
    }

    function submitOrderReview(e, orderId) {
      e.preventDefault();
      const o = State.orders.find(x => x.id === orderId);
      if (!o) return;
      const rating = Number(document.getElementById(`rev_star_${orderId}`).value);
      const text = document.getElementById(`rev_text_${orderId}`).value.trim();
      o.review = { rating, text, updated_at: new Date().toLocaleString("vi-VN") };
      saveStorage();
      renderAll();
      showNotice("Đã lưu đánh giá đơn hàng!", "Order review saved!");
    }

    function sendOrderMessage(e, orderId, role) {
      e.preventDefault();
      const o = State.orders.find(x => x.id === orderId);
      if (!o) return;
      const inp = document.getElementById(`msg_${role === 'seller' ? 's' : 'b'}_${orderId}`);
      const body = inp.value.trim();
      if (!body) return;
      o.messages = o.messages || [];
      o.messages.push({ sender_role: role, body, created_at: new Date().toLocaleString("vi-VN") });
      saveStorage();
      renderAll();
    }

    function renderBuyerOrders() {
      return `
    <section class="mx-auto w-full max-w-[1440px] px-5 py-10 sm:px-8 lg:px-16">
      <h1 class="text-3xl font-medium text-[#234d38]">${tr("Đơn hàng của bạn", "Your orders")}</h1>
      <p class="mt-2 mb-6 text-sm text-[#626b5e]">${tr("Theo dõi tiến trình xác nhận, giao hàng, gửi đánh giá 1–5 sao và nhắn tin trực tiếp với chủ cửa hàng.", "Track order confirmation, delivery status, leave 1–5 star reviews, and message the seller.")}</p>
      <div class="grid w-full grid-cols-1 items-start gap-6 xl:grid-cols-2">
        ${State.orders.map(o => renderOrderCard(o, false)).join("")}
      </div>
    </section>
  `;
    }

    function renderSellerOrders() {
      const deliveredPaid = State.orders.filter(o => o.status === "delivered" && o.payment === "paid");
      const gross = deliveredPaid.reduce((s, o) => s + o.total, 0);
      const commission = deliveredPaid.reduce((s, o) => s + (o.commission_bps_snapshot !== null ? Math.round((o.total * o.commission_bps_snapshot) / 10000) : 0), 0);
      const net = gross - commission;

      return `
    <section class="mx-auto w-full max-w-[1440px] px-5 py-10 sm:px-8 lg:px-16">
      <h1 class="text-3xl font-medium text-[#234d38] mb-6">${tr("Đơn hàng & doanh thu", "Orders & revenue")}</h1>
      <div class="mb-5 grid w-full grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div class="rounded-2xl border border-[#dce2d4] bg-white p-5"><p class="text-xs text-[#626b5e]">${tr("Doanh thu đã giao + đã thanh toán", "Delivered + paid gross")}</p><div class="mt-3 text-xl font-semibold text-[#234d38]">${money(gross)}</div></div>

      saveStorage();
      renderAll();

    function calculateHealthMetrics(e) {
      e.preventDefault();
      const age = Number(document.getElementById("h_age").value);
      const sex = document.getElementById("h_sex").value;
      const hCm = Number(document.getElementById("h_height").value);
      const wKg = Number(document.getElementById("h_weight").value);
      const act = Number(document.getElementById("h_act").value);
      const hM = hCm / 100;
      const bmi = (wKg / (hM * hM)).toFixed(1);
      const bmr = Math.round(10 * wKg + 6.25 * hCm - 5 * age + (sex === "male" ? 5 : -161));
      const tdee = Math.round(bmr * act);
      const idealMin = (18.5 * hM * hM).toFixed(1);
      const idealMax = (22.9 * hM * hM).toFixed(1);
      const bmiLabel = bmi < 18.5 ? tr("Thiếu cân", "Underweight") : bmi <= 22.9 ? tr("Cân đối", "Normal") : tr("Thừa cân", "Overweight");
      State.healthResult = { bmi, bmr, tdee, idealMin, idealMax, bmiLabel };
      renderAll();
    }

    function submitAdviceChat(e) {
      if (e.preventDefault) e.preventDefault();
      const inp = document.getElementById("adviceInput");
      const q = inp.value.trim();
      if (!q) return;
      State.adviceMessages.push({ role: "user", vi: q, en: q });

      const low = q.toLowerCase();
      let replyVi = "";
      let replyEn = "";

        replyEn = "Meals under 260 kcal rich in fiber include: <b>Rainbow quinoa bowl</b> (255 kcal, 8g fiber), <b>Chicken breast & kale salad</b> (250 kcal, 5g fiber), <b>Tropical green smoothie</b> (200 kcal, 7g fiber), and <b>Pan-seared veggies with avocado</b> (140 kcal, 6g fiber).";
      } else {
        replyVi = "Dựa trên danh mục NourishBitfe Organics, bạn có thể kết hợp bữa sáng với <b>Granola hạt & yến mạch</b> (220 kcal) kèm <b>Sinh tố xanh nhiệt đới</b> (200 kcal), bữa trưa dùng <b>Bowl cá hồi gạo lứt</b> (515 kcal) và bữa tối thanh nhẹ với <b>Quinoa bowl và rau củ</b> (255 kcal).";
        replyEn = "Based on our catalog, you can pair <b>Nutty oat granola</b> (220 kcal) with a <b>Tropical green smoothie</b> (200 kcal) for breakfast, enjoy the <b>Salmon & brown rice bowl</b> (515 kcal) for lunch, and have the <b>Rainbow quinoa bowl</b> (255 kcal) for dinner.";
      }
      State.adviceMessages.push({ role: "assistant", vi: replyVi, en: replyEn });
      renderAll();
    }

    // ============================================================================
    // 13. ACCOUNT (không có nút chuyển vai trò, lưu thật vào Supabase)
    // ============================================================================
    function renderAccount() {
      const p = State.profile;
      const isSeller = NB_AUTH_ROLE === "seller";

      return `
    <div class="mx-auto w-full max-w-5xl px-5 py-10 sm:px-8">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <h1 class="text-3xl font-medium text-[#234d38]">${tr("Tài khoản của bạn", "Your account")}</h1>
        <span class="rounded-full bg-[#eef2e8] px-4 py-2 text-xs font-semibold text-[#234d38]">
          ${isSeller ? tr("Chủ cửa hàng (Seller)", "Seller") : tr("Người mua (Buyer)", "Buyer")}
        </span>
      </div>

      <form onsubmit="saveProfile(event)" class="mt-7 rounded-2xl border border-[#dce2d4] bg-white p-6 sm:p-8 space-y-5">
        <h2 class="text-xl font-semibold text-[#234d38]">${tr("Hồ sơ & địa chỉ", "Profile & address")}</h2>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div><label class="mb-1 block text-xs font-medium">${tr("Họ và tên *", "Full name *")}</label>
            <input id="pf_name" required value="${p.display_name || ''}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
          <div><label class="mb-1 block text-xs font-medium">${tr("Điện thoại", "Phone")}</label>
            <input id="pf_phone" value="${p.phone || ''}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
          <div class="sm:col-span-2"><label class="mb-1 block text-xs font-medium">${tr("Địa chỉ (số nhà, đường)", "Street address")}</label>
            <input id="pf_addr1" value="${p.shipping_address_line1 || ''}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
          <div><label class="mb-1 block text-xs font-medium">${tr("Phường / xã", "Ward")}</label>
            <input id="pf_ward" value="${p.shipping_ward || ''}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
          <div><label class="mb-1 block text-xs font-medium">${tr("Quận / huyện", "District")}</label>
            <input id="pf_dist" value="${p.shipping_district || ''}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
          <div><label class="mb-1 block text-xs font-medium">${tr("Tỉnh / thành phố", "City")}</label>
            <input id="pf_city" value="${p.shipping_city || ''}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
          <div><label class="mb-1 block text-xs font-medium">${tr("Mã bưu chính", "Postal code")}</label>
            <input id="pf_postal" value="${p.shipping_postal_code || ''}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
        </div>

        ${isSeller ? `
          <div class="border-t border-[#dce2d4] pt-5">
            <h3 class="text-lg font-semibold text-[#234d38]">${tr("Thông tin ngân hàng (chỉ lưu 4 số cuối)", "Bank reference (last 4 digits only)")}</h3>
            <div class="mt-3 grid grid-cols-1 gap-4 sm:grid-cols-3">
              <div><label class="mb-1 block text-xs font-medium">${tr("Tên ngân hàng", "Bank name")}</label>
                <input id="pf_bank" value="${p.bank_name || ''}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
              <div><label class="mb-1 block text-xs font-medium">${tr("Chủ tài khoản", "Account holder")}</label>
                <input id="pf_holder" value="${p.account_holder_name || ''}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
              <div><label class="mb-1 block text-xs font-medium">${tr("4 số cuối", "Last 4 digits")}</label>
                <input id="pf_last4" maxlength="4" pattern="[0-9]{4}" value="${p.bank_account_last4 || ''}" class="w-full rounded-xl border border-[#d8dfcf] px-4 py-3 text-sm"></div>
            </div>
          </div>
        ` : ''}

        <button type="submit" id="pf_save_btn" class="rounded-full bg-[#234d38] px-7 py-3 text-sm font-semibold text-white hover:bg-[#173a29]">
          ${tr("Lưu hồ sơ", "Save profile")}
        </button>
      </form>
    </div>
  `;
    }

    async function saveProfile(e) {
      e.preventDefault();
      if (!NB_SUPABASE_READY || !NB_AUTH_USER) {
        showNotice("Bạn cần đăng nhập để lưu hồ sơ.", "Please sign in to save your profile.", true);
        return;
      }
      const btn = document.getElementById("pf_save_btn");
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = tr("Đang lưu...", "Saving...");

      const isSeller = NB_AUTH_ROLE === "seller";
      const payload = {
        id: NB_AUTH_USER.id,
        display_name: document.getElementById("pf_name").value.trim(),
        phone: document.getElementById("pf_phone").value.trim() || null,
        shipping_address_line1: document.getElementById("pf_addr1").value.trim() || null,
        shipping_ward: document.getElementById("pf_ward").value.trim() || null,
        shipping_district: document.getElementById("pf_dist").value.trim() || null,
        shipping_city: document.getElementById("pf_city").value.trim() || null,
        shipping_postal_code: document.getElementById("pf_postal").value.trim() || null,
        updated_at: new Date().toISOString()
      };
      if (isSeller) {
        payload.bank_name = document.getElementById("pf_bank").value.trim() || null;
        payload.account_holder_name = document.getElementById("pf_holder").value.trim() || null;
        payload.bank_account_last4 = document.getElementById("pf_last4").value.trim() || null;
      }

      const { error } = await NB_SUPABASE.from("profiles").upsert(payload, { onConflict: "id" });
      btn.disabled = false;
      btn.textContent = originalText;

      if (error) {
        console.error("Profile save failed:", error);
        showNotice("Không lưu được hồ sơ: " + error.message, "Could not save profile: " + error.message, true);
        return;
      }

      Object.assign(State.profile, payload);
      showNotice("Đã lưu hồ sơ thành công.", "Profile saved successfully.");
      renderAll();
    }

    // ============================================================================
    // 14. RENDER ALL
    // ============================================================================
    function renderAll() {
      renderHeader();
      const root = document.getElementById("appRoot");
      if (State.route === "shop") root.innerHTML = renderShop();
      else if (State.route === "detail") root.innerHTML = renderDetail();
      else if (State.route === "cart") root.innerHTML = renderCart();
      else if (State.route === "checkout") root.innerHTML = renderCheckout();
      else if (State.route === "orders") root.innerHTML = renderBuyerOrders();
      else if (State.route === "seller_orders") root.innerHTML = renderSellerOrders();
      else if (State.route === "manage") root.innerHTML = renderManage();
      else if (State.route === "health") root.innerHTML = renderHealth();
      else if (State.route === "advice") root.innerHTML = renderAdvice();
      else if (State.route === "account") root.innerHTML = renderAccount();
    }

    // ============================================================================
    // 15. AUTH
    // ============================================================================
    async function handleGoogleAuth() {
      if (!NB_SUPABASE_READY) {
        showNotice("Hãy cấu hình NB_SUPABASE_URL và NB_SUPABASE_ANON_KEY ở đầu file HTML trước.", "Configure NB_SUPABASE_URL and NB_SUPABASE_ANON_KEY at the top of this HTML file first.", true);
        return;
      }
      if (NB_AUTH_BUSY) return;
      NB_AUTH_BUSY = true;
      try {
        if (NB_AUTH_USER) {
          const { error } = await NB_SUPABASE.auth.signOut();
          if (error) throw error;
          NB_AUTH_USER = null; NB_AUTH_ROLE = null; State.signedIn = false; State.currentRole = "buyer"; State.route = "shop"; renderAll();
        } else {
          const { error } = await NB_SUPABASE.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: window.location.origin + window.location.pathname }
          });
          if (error) throw error;
        }
      } catch (err) { showNotice("Không thể đăng nhập: " + (err.message || err), "Sign-in failed: " + (err.message || err), true); }
      finally { NB_AUTH_BUSY = false; }
    }

    async function nbLoadAuthState() {
      if (!NB_SUPABASE_READY) {
        NB_AUTH_USER = null;
        NB_AUTH_ROLE = null;
        State.signedIn = false;
        State.currentRole = "buyer";
        return;
      }

      const { data: { session }, error } =
        await NB_SUPABASE.auth.getSession();

      if (error) console.error("Could not get session:", error);

      NB_AUTH_USER = session?.user || null;
      State.signedIn = !!NB_AUTH_USER;
      State.currentRole = "buyer";
      NB_AUTH_ROLE = null;

      if (!NB_AUTH_USER) return;

      const { data, error: roleError } = await NB_SUPABASE
        .from("profiles")
        .select("role,display_name")
        .eq("id", NB_AUTH_USER.id)
        .maybeSingle();

      if (roleError) {
        console.error("Could not load profile:", roleError);
        NB_AUTH_ROLE = null;
        State.currentRole = "buyer";
      } else {
        NB_AUTH_ROLE = data?.role || "buyer";
        State.currentRole =
          NB_AUTH_ROLE === "seller" ? "owner" : "buyer";
      }

      State.profile = {
        display_name: data?.display_name || NB_AUTH_USER.email || "",
        email: NB_AUTH_USER.email || "",
        phone: "",
        shipping_address_line1: "",
        shipping_ward: "",
        shipping_district: "",
        shipping_city: "",
        shipping_postal_code: "",
        bank_name: "",
        account_holder_name: "",
        bank_account_last4: ""
      };

      const { data: orderRows, error: orderError } = await NB_SUPABASE
        .from("nb_orders")
        .select("data")
        .order("created_at", { ascending: false });

      if (!orderError && Array.isArray(orderRows)) {
        State.orders = orderRows
          .map(row => row.data)
          .filter(o =>
            NB_AUTH_ROLE === "seller" ||
            o.buyer_sub === NB_AUTH_USER.id
          );
      }
    }

    async function nbLoadSharedData() {
      if (!NB_SUPABASE_READY) return;
      const { data: productRows, error } = await NB_SUPABASE.from("nb_products").select("data").eq("is_active", true).order("id");
      if (!error && productRows && productRows.length) State.products = productRows.map(row => row.data);
      else if (error) console.error("Supabase products not loaded; check schema/RLS:", error);
    }

    (async function nbBoot() {
      await nbLoadAuthState();
      await nbLoadSharedData();
      if (NB_SUPABASE_READY) {
        NB_SUPABASE.auth.onAuthStateChange((_event, session) => {
          setTimeout(async () => { await nbLoadAuthState(); await nbLoadSharedData(); renderAll(); }, 0);
        });
      }
      renderAll();
    })();
  </script>
